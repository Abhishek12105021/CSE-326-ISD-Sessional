  <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    const yamlSpec = "openapi: 3.0.3\ninfo:\n  title: YouTube API Services - Recommendation & Notification Architecture\n  description: |\n    ### Base URL\n\n    | Type | URL |\n    |------|-----|\n    | **All Traffic** | `https://api.youtube.com/api` |\n\n    > Internal endpoints are prefixed with `/internal/` and are blocked from external access at the API Gateway level.\n\n    ---\n\n    ### Module Overview\n\n    | # | Module | Submodules |\n    |---|--------|------------|\n    | 1 | **Unified Feed Generation & Content Discovery** | Auth & Sessions, Videos & Feeds |\n    | 2 | **Watch History Analysis & Behavior Tracking** | Video Playback & Streaming, Settings & Users |\n    | 3 | **User Preference & Personalization Control** | Engagement & Interactions, Playlists, Subscriptions, Inter-Service Data Services |\n    | 4 | **Notification System** | Notifications, Inter-Service Event Triggers |\n\n    ---\n\n    ### Authentication\n    All protected endpoints require a `Bearer` JWT token obtained from `POST /auth/google` or `POST /auth/refresh`.\n\n  version: 1.9.0\n\nservers:\n  - url: https://api.youtube.com/api\n    description: API Gateway (routes /internal/* to microservices internally)\n\ntags:\n  - name: \"Module 1 \u25b8 Auth & Sessions\"\n    description: |\n      **Module: Unified Feed Generation & Content Discovery**\n\n      User authentication via Google OAuth 2.0, JWT token lifecycle (issue, refresh, revoke),\n      and session initialization \u2014 capturing geo, device, and browser context used downstream\n      by the Recommendation Engine to personalize the feed.\n\n  - name: \"Module 1 \u25b8 Videos & Feeds\"\n    description: |\n      **Module: Unified Feed Generation & Content Discovery**\n\n      Paginated endless-scroll home feed (delegates ranking to the AI Engine), individual\n      video metadata loading, related/up-next recommendations, recommendation strategy control,\n      and the internal raw video candidate endpoint consumed by the AI ranking models.\n\n  - name: \"Module 2 \u25b8 Video Playback & Streaming\"\n    description: |\n      **Module: Watch History Analysis & Behavior Tracking**\n\n      Stream manifest retrieval, video chapter markers, watch-start event signaling,\n      real-time playback telemetry (PLAY / PAUSE / SEEK / BUFFER), cross-device\n      position sync, and watch summary submission to the Analytics Service.\n\n  - name: \"Module 2 \u25b8 Settings & Users\"\n    description: |\n      **Module: Watch History Analysis & Behavior Tracking**\n\n      Watch history retrieval and deletion, user settings (privacy toggles, preference vector),\n      and the internal endpoint for the Analytics Service to append watch summaries to the\n      user's permanent database record.\n\n  - name: \"Module 3 \u25b8 Engagement & Interactions\"\n    description: |\n      **Module: User Preference & Personalization Control**\n\n      Explicit video interactions (LIKE, DISLIKE, CLIP, SAVE), video statistics,\n      comments (read/write), share event logging, and algorithmic feed-correction\n      feedback signals (NOT_INTERESTED, DONT_RECOMMEND_CHANNEL).\n\n  - name: \"Module 3 \u25b8 Playlists\"\n    description: |\n      **Module: User Preference & Personalization Control**\n\n      Full CRUD for user playlists and nested item management via\n      `/playlists/{playlistId}/items` and `/playlists/{playlistId}/items/{itemId}`.\n\n  - name: \"Module 3 \u25b8 Subscriptions\"\n    description: |\n      **Module: User Preference & Personalization Control**\n\n      User channel subscription management \u2014 list, subscribe, and unsubscribe.\n      Bell-icon alert status is checked internally before dispatching Type 1 push notifications.\n\n  - name: \"Module 3 \u25b8 Inter-Service: Data Services\"\n    description: |\n      **Module: User Preference & Personalization Control \u2014 INTERNAL**\n\n      Core database mutation and retrieval APIs used exclusively by internal microservices.\n      All routes prefixed `/internal/`. Blocked from external access at the gateway.\n\n  - name: \"Module 4 \u25b8 Notifications\"\n    description: |\n      **Module: Notification System**\n\n      Client-facing notification inbox (list, mark as read) and push preference\n      management (global enable/disable toggle).\n\n  - name: \"Module 4 \u25b8 Inter-Service: Event Triggers\"\n    description: |\n      **Module: Notification System \u2014 INTERNAL**\n\n      Async event webhooks that wake the Notification Manager. All routes prefixed `/internal/`.\n      **Type 1** \u2014 new upload trigger (Ingestion \u2192 Notification Manager \u2192 subscribers).\n      **Type 2** \u2014 AI relevance trigger (AI Engine \u2192 Notification Manager \u2192 target user).\n      Also covers delivery logging to prevent duplicate pushes.\n\npaths:\n\n  # =====================================================\n  # MODULE 1 \u25b8 AUTH & SESSIONS\n  # =====================================================\n\n  /auth/google:\n    post:\n      tags:\n        - \"Module 1 \u25b8 Auth & Sessions\"\n      summary: Authenticate via Google Account\n      description: \"Exchanges a Google OAuth 2.0 ID token or authorization code for a YouTube API session. Acts as both login and registration (if the YouTube profile doesn't exist yet).\"\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/GoogleAuthRequest'\n      responses:\n        '200':\n          description: Successfully authenticated; YouTube profile provisioned.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/AuthResponse'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n\n  /auth/refresh:\n    post:\n      tags:\n        - \"Module 1 \u25b8 Auth & Sessions\"\n      summary: Refresh JWT Token\n      description: \"Exchanges a valid refresh token for a new short-lived JWT access token.\"\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - refreshToken\n              properties:\n                refreshToken:\n                  type: string\n                  example: \"ref_token_xyz789...\"\n      responses:\n        '200':\n          description: Tokens successfully refreshed.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/AuthResponse'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n\n  /auth/logout:\n    post:\n      tags:\n        - \"Module 1 \u25b8 Auth & Sessions\"\n      summary: Logout User\n      description: \"Invalidates the current session and revokes the active refresh token.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '204':\n          description: Successfully logged out.\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n\n  /auth/profile:\n    get:\n      tags:\n        - \"Module 1 \u25b8 Auth & Sessions\"\n      summary: Get Current User Profile\n      description: \"Retrieves the core identity profile of the currently authenticated user.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '200':\n          description: Successfully retrieved user profile.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/UserProfile'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n\n  /sessions:\n    post:\n      tags:\n        - \"Module 1 \u25b8 Auth & Sessions\"\n      summary: Initialize Tracking Session\n      description: \"Called when the app opens. Generates an interaction session ID and extracts contextual data (geo, device, browser) used later by the Recommendation Engine.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/SessionCreateRequest'\n      responses:\n        '201':\n          description: Session created with context tracking active.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SessionContext'\n\n  # =====================================================\n  # MODULE 1 \u25b8 VIDEOS & FEEDS\n  # =====================================================\n\n  /videos:\n    get:\n      tags:\n        - \"Module 1 \u25b8 Videos & Feeds\"\n      summary: List Videos (Home Feed)\n      description: |\n        Generates the dynamic Home Feed catalog, optimized for endless scrolling.\n        Delegates ranking to the Recommendation Engine based on the user's active session.\n        Branches internally into a **Cold Start** strategy (new users) or **Personalization** strategy (returning users).\n      security:\n        - BearerAuth: []\n      parameters:\n        - in: query\n          name: sessionId\n          schema:\n            type: string\n        - in: query\n          name: quantity\n          schema:\n            type: integer\n            default: 15\n        - in: query\n          name: pageToken\n          schema:\n            type: string\n      responses:\n        '200':\n          description: Paginated list of ranked video candidates.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/VideoListResponse'\n        '429':\n          $ref: '#/components/responses/RateLimitError'\n\n  /videos/{videoId}:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    get:\n      tags:\n        - \"Module 1 \u25b8 Videos & Feeds\"\n      summary: Load Video Metadata\n      description: \"Fetches specific video metadata, description, and statistics necessary prior to starting playback.\"\n      responses:\n        '200':\n          description: Video details loaded successfully.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Video'\n        '404':\n          $ref: '#/components/responses/NotFoundError'\n\n  /videos/{videoId}/related:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    get:\n      tags:\n        - \"Module 1 \u25b8 Videos & Feeds\"\n      summary: Get Related Videos (Up Next)\n      description: \"Generates the sidebar/up-next recommendation feed based on the currently watching video and user context.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '200':\n          description: Ranked list of related candidates.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/VideoListResponse'\n\n  /internal/recommendations-strategy:\n    put:\n      tags:\n        - \"Module 1 \u25b8 Videos & Feeds\"\n      summary: \"[INTERNAL] Set Recommendation Strategy\"\n      description: |\n        Configures the active recommendation strategy for the feed engine.\n        - **COLD_START** \u2014 new/anonymous users; falls back to trending/regional content.\n        - **PERSONALIZED** \u2014 returning users; uses watch history, preference vector, and session context.\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - strategy\n              properties:\n                strategy:\n                  type: string\n                  enum: [COLD_START, PERSONALIZED]\n                  example: \"PERSONALIZED\"\n                userId:\n                  type: string\n                  example: \"user_abc123\"\n                sessionId:\n                  type: string\n                  example: \"sess_987654321\"\n      responses:\n        '200':\n          description: Strategy successfully applied.\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  strategy:\n                    type: string\n                    enum: [COLD_START, PERSONALIZED]\n                    example: \"PERSONALIZED\"\n                  appliedAt:\n                    type: string\n                    format: date-time\n                    example: \"2025-03-01T10:00:00Z\"\n        '400':\n          $ref: '#/components/responses/BadRequestError'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n\n  /internal/videos/candidates:\n    get:\n      tags:\n        - \"Module 1 \u25b8 Videos & Feeds\"\n      summary: \"[INTERNAL] Fetch Raw Video Catalog (AI Engine \u2794 Data Services)\"\n      description: \"Fetches raw video catalogs and trending scores so the AI Engine can run its ranking models.\"\n      parameters:\n        - in: query\n          name: region\n          schema:\n            type: string\n        - in: query\n          name: limit\n          schema:\n            type: integer\n            default: 500\n      responses:\n        '200':\n          description: Raw candidate list.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/VideoListResponse'\n\n  # =====================================================\n  # MODULE 2 \u25b8 VIDEO PLAYBACK & STREAMING\n  # =====================================================\n\n  /videos/{videoId}/stream:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    get:\n      tags:\n        - \"Module 2 \u25b8 Video Playback & Streaming\"\n      summary: Get Stream Manifest\n      description: \"Retrieves the HLS or DASH manifest URLs, available resolutions, and DRM licenses required for the video player to fetch media chunks.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '200':\n          description: Stream manifest URLs successfully retrieved.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/StreamManifestResponse'\n        '404':\n          $ref: '#/components/responses/NotFoundError'\n\n  /videos/{videoId}/chapters:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    get:\n      tags:\n        - \"Module 2 \u25b8 Video Playback & Streaming\"\n      summary: Get Video Chapters\n      description: \"Retrieves timeline markers and chapters for the frontend player UI.\"\n      responses:\n        '200':\n          description: Chapters retrieved successfully.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ChapterListResponse'\n\n  /videos/{videoId}/playback/start:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    post:\n      tags:\n        - \"Module 2 \u25b8 Video Playback & Streaming\"\n      summary: Send Watch Start\n      description: \"Triggered immediately when the player successfully loads the first frame. Opens the session record in Data Services.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                sessionId:\n                  type: string\n                  example: \"sess_987654321\"\n      responses:\n        '202':\n          description: Watch start registered.\n\n  /videos/playback/telemetry:\n    post:\n      tags:\n        - \"Module 2 \u25b8 Video Playback & Streaming\"\n      summary: Record Playback Telemetry\n      description: \"Aggregates real-time events (`PLAY`, `PAUSE`, `SEEK`, `BUFFER`) while the user is watching.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/PlaybackEventBatch'\n      responses:\n        '202':\n          description: Telemetry events accepted into the aggregation queue.\n        '400':\n          $ref: '#/components/responses/BadRequestError'\n\n  /videos/{videoId}/watch-summary:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    post:\n      tags:\n        - \"Module 2 \u25b8 Video Playback & Streaming\"\n      summary: Submit Watch Summary\n      description: \"Called at end of session. Sends aggregated watch data (total minutes, skip ratio) to Analytics, which then updates Data Services.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WatchSummary'\n      responses:\n        '202':\n          description: Watch summary accepted and queued for processing.\n\n  /videos/{videoId}/playback/position:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    put:\n      tags:\n        - \"Module 2 \u25b8 Video Playback & Streaming\"\n      summary: Sync Playback Position\n      description: \"Saves the user's current playback timestamp to enable the 'Resume Watching' feature across devices.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                positionSeconds:\n                  type: integer\n                  example: 134\n      responses:\n        '204':\n          description: Playback position successfully synced.\n\n  # =====================================================\n  # MODULE 2 \u25b8 SETTINGS & USERS\n  # =====================================================\n\n  /history:\n    get:\n      tags:\n        - \"Module 2 \u25b8 Settings & Users\"\n      summary: Retrieve Watch History\n      description: \"Fetches the user's previously watched videos, ordered chronologically.\"\n      security:\n        - BearerAuth: []\n      parameters:\n        - in: query\n          name: pageToken\n          schema:\n            type: string\n      responses:\n        '200':\n          description: Successfully retrieved watch history.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/VideoListResponse'\n    delete:\n      tags:\n        - \"Module 2 \u25b8 Settings & Users\"\n      summary: Clear Watch History\n      description: \"Triggers the `deleteHistory()` cascade, permanently removing all watch history entries.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '204':\n          description: History successfully cleared.\n\n  /settings:\n    get:\n      tags:\n        - \"Module 2 \u25b8 Settings & Users\"\n      summary: Retrieve User Controls\n      description: \"Fetches all user settings including `privacy`, `prefVector`, and `restrictions`.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '200':\n          description: User settings payload.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/UserSettings'\n\n  /settings/privacy:\n    put:\n      tags:\n        - \"Module 2 \u25b8 Settings & Users\"\n      summary: Update Privacy Settings\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                dataTrackingEnabled:\n                  type: boolean\n                  example: false\n      responses:\n        '200':\n          description: Privacy settings successfully updated.\n\n  /settings/preferences:\n    put:\n      tags:\n        - \"Module 2 \u25b8 Settings & Users\"\n      summary: Modify Preference Vector\n      description: \"Manually tunes the user's algorithmic topical interest tags.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                interests:\n                  type: array\n                  items:\n                    type: string\n                  example: [\"technology\", \"music\", \"gaming\"]\n      responses:\n        '200':\n          description: Preference vector successfully updated.\n\n  /internal/users/{userId}/history:\n    parameters:\n      - in: path\n        name: userId\n        required: true\n        schema:\n          type: string\n    post:\n      tags:\n        - \"Module 2 \u25b8 Settings & Users\"\n      summary: \"[INTERNAL] Append Watch History (Analytics \u2794 Data Services)\"\n      description: \"The Analytics Service appends the computed WatchSummary to the user's permanent database record.\"\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WatchSummary'\n      responses:\n        '201':\n          description: History record appended.\n\n  # =====================================================\n  # MODULE 3 \u25b8 ENGAGEMENT & INTERACTIONS\n  # =====================================================\n\n  /videos/{videoId}/stats:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    get:\n      tags:\n        - \"Module 3 \u25b8 Engagement & Interactions\"\n      summary: Get Video Statistics\n      description: \"Retrieves detailed interaction statistics \u2014 views, likes, dislikes, comments, shares.\"\n      responses:\n        '200':\n          description: Video statistics retrieved successfully.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/VideoStats'\n        '404':\n          $ref: '#/components/responses/NotFoundError'\n\n  /videos/{videoId}/interact:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    post:\n      tags:\n        - \"Module 3 \u25b8 Engagement & Interactions\"\n      summary: Interact with Video (Like / Dislike / Clip / Save)\n      description: \"Performs an explicit interaction on a video \u2014 LIKE, DISLIKE, CLIP, or SAVE.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/VideoInteractionRequest'\n      responses:\n        '200':\n          description: Interaction recorded successfully.\n        '400':\n          $ref: '#/components/responses/BadRequestError'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n\n  /videos/{videoId}/feedback:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    post:\n      tags:\n        - \"Module 3 \u25b8 Engagement & Interactions\"\n      summary: Submit Algorithmic Feedback\n      description: \"Handles feed-correction signals. Logged via `FeedbackManager` and triggers internal preference updates.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - action\n              properties:\n                action:\n                  type: string\n                  enum: ['NOT_INTERESTED', 'DONT_RECOMMEND_CHANNEL']\n                  example: \"NOT_INTERESTED\"\n      responses:\n        '204':\n          description: Algorithmic feedback successfully applied.\n        '400':\n          $ref: '#/components/responses/BadRequestError'\n\n  /videos/{videoId}/comments:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    get:\n      tags:\n        - \"Module 3 \u25b8 Engagement & Interactions\"\n      summary: List Video Comments\n      description: \"Retrieves a paginated list of top-level comments for the specified video.\"\n      parameters:\n        - in: query\n          name: pageToken\n          schema:\n            type: string\n        - in: query\n          name: maxResults\n          schema:\n            type: integer\n            default: 20\n      responses:\n        '200':\n          description: Paginated list of comments.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/CommentListResponse'\n    post:\n      tags:\n        - \"Module 3 \u25b8 Engagement & Interactions\"\n      summary: Add a Comment\n      description: \"Posts a new top-level comment to the video.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - text\n              properties:\n                text:\n                  type: string\n                  example: \"This video was incredibly helpful, thanks for sharing!\"\n      responses:\n        '201':\n          description: Comment successfully posted.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Comment'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n\n  /videos/{videoId}/share:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    post:\n      tags:\n        - \"Module 3 \u25b8 Engagement & Interactions\"\n      summary: Record Share Interaction\n      description: \"Logs that the user shared this video. Provides a significant boost to the internal trending score.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                platform:\n                  type: string\n                  example: \"twitter\"\n      responses:\n        '202':\n          description: Share interaction recorded for analytics.\n\n  # =====================================================\n  # MODULE 3 \u25b8 PLAYLISTS\n  # =====================================================\n\n  /playlists:\n    get:\n      tags:\n        - \"Module 3 \u25b8 Playlists\"\n      summary: List Playlists\n      description: \"Returns all playlists owned by the authenticated user, or specific playlists by ID.\"\n      security:\n        - BearerAuth: []\n      parameters:\n        - in: query\n          name: id\n          description: Comma-separated list of playlist IDs to retrieve.\n          schema:\n            type: string\n        - in: query\n          name: mine\n          description: Set to true to retrieve the authenticated user's playlists.\n          schema:\n            type: boolean\n        - in: query\n          name: pageToken\n          schema:\n            type: string\n      responses:\n        '200':\n          description: Successfully retrieved playlists.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/PlaylistListResponse'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n    post:\n      tags:\n        - \"Module 3 \u25b8 Playlists\"\n      summary: Create Playlist\n      description: \"Creates a new playlist for the authenticated user.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/Playlist'\n      responses:\n        '201':\n          description: Playlist successfully created.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Playlist'\n        '400':\n          $ref: '#/components/responses/BadRequestError'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n\n  /playlists/{playlistId}:\n    parameters:\n      - in: path\n        name: playlistId\n        required: true\n        description: The unique ID of the playlist.\n        schema:\n          type: string\n    get:\n      tags:\n        - \"Module 3 \u25b8 Playlists\"\n      summary: Get Playlist\n      description: \"Retrieves a single playlist by ID including its metadata.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '200':\n          description: Playlist retrieved successfully.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Playlist'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n        '404':\n          $ref: '#/components/responses/NotFoundError'\n    put:\n      tags:\n        - \"Module 3 \u25b8 Playlists\"\n      summary: Update Playlist\n      description: \"Modifies a playlist's title, description, or privacy status.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/Playlist'\n      responses:\n        '200':\n          description: Playlist successfully updated.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Playlist'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n        '404':\n          $ref: '#/components/responses/NotFoundError'\n    delete:\n      tags:\n        - \"Module 3 \u25b8 Playlists\"\n      summary: Delete Playlist\n      description: \"Permanently deletes the specified playlist.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '204':\n          description: Playlist successfully deleted.\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n        '404':\n          $ref: '#/components/responses/NotFoundError'\n\n  /playlists/{playlistId}/items:\n    parameters:\n      - in: path\n        name: playlistId\n        required: true\n        description: The unique ID of the playlist.\n        schema:\n          type: string\n    get:\n      tags:\n        - \"Module 3 \u25b8 Playlists\"\n      summary: List Playlist Items\n      description: \"Returns all videos inside the specified playlist.\"\n      parameters:\n        - in: query\n          name: pageToken\n          schema:\n            type: string\n        - in: query\n          name: maxResults\n          schema:\n            type: integer\n            default: 20\n      responses:\n        '200':\n          description: Successfully retrieved playlist items.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/PlaylistItemListResponse'\n        '404':\n          $ref: '#/components/responses/NotFoundError'\n    post:\n      tags:\n        - \"Module 3 \u25b8 Playlists\"\n      summary: Insert Playlist Item\n      description: \"Adds a video to the specified playlist.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/PlaylistItem'\n      responses:\n        '201':\n          description: Item successfully added to the playlist.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/PlaylistItem'\n        '400':\n          $ref: '#/components/responses/BadRequestError'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n\n  /playlists/{playlistId}/items/{itemId}:\n    parameters:\n      - in: path\n        name: playlistId\n        required: true\n        description: The unique ID of the playlist.\n        schema:\n          type: string\n      - in: path\n        name: itemId\n        required: true\n        description: The unique ID of the playlist item.\n        schema:\n          type: string\n    put:\n      tags:\n        - \"Module 3 \u25b8 Playlists\"\n      summary: Update Playlist Item\n      description: \"Modifies a playlist item, e.g. updating its position.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/PlaylistItem'\n      responses:\n        '200':\n          description: Playlist item successfully updated.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/PlaylistItem'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n        '404':\n          $ref: '#/components/responses/NotFoundError'\n    delete:\n      tags:\n        - \"Module 3 \u25b8 Playlists\"\n      summary: Delete Playlist Item\n      description: \"Removes a video from the playlist.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '204':\n          description: Playlist item successfully deleted.\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n        '404':\n          $ref: '#/components/responses/NotFoundError'\n\n  # =====================================================\n  # MODULE 3 \u25b8 SUBSCRIPTIONS\n  # =====================================================\n\n  /subscriptions:\n    get:\n      tags:\n        - \"Module 3 \u25b8 Subscriptions\"\n      summary: List Subscriptions\n      description: \"Retrieves a list of active channel subscriptions for the authenticated user.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '200':\n          description: Subscriptions retrieved successfully.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SubscriptionListResponse'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n    post:\n      tags:\n        - \"Module 3 \u25b8 Subscriptions\"\n      summary: Insert Subscription\n      description: \"Adds a new channel subscription to the user's profile.\"\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                channelId:\n                  type: string\n                  example: \"UC_x5XG1OV2P6uZZ5FSM9Ttw\"\n      responses:\n        '201':\n          description: Subscribed successfully.\n\n  /subscriptions/{channelId}:\n    parameters:\n      - in: path\n        name: channelId\n        required: true\n        schema:\n          type: string\n    delete:\n      tags:\n        - \"Module 3 \u25b8 Subscriptions\"\n      summary: Delete Subscription\n      description: \"Removes a specific channel from the user's subscriptions.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '204':\n          description: Unsubscribed successfully.\n\n  # =====================================================\n  # MODULE 3 \u25b8 INTER-SERVICE: DATA SERVICES\n  # =====================================================\n\n  /internal/users/{userId}/context:\n    parameters:\n      - in: path\n        name: userId\n        required: true\n        schema:\n          type: string\n    get:\n      tags:\n        - \"Module 3 \u25b8 Inter-Service: Data Services\"\n      summary: Get User Context (AI Engine \u2794 Data Services)\n      description: \"Called by the AI Engine to fetch aggregated User Profile, Preferences, and Watch History to formulate the Personalization Strategy.\"\n      responses:\n        '200':\n          description: Complete user context.\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  profile:\n                    $ref: '#/components/schemas/UserSettings'\n                  recentHistoryIds:\n                    type: array\n                    items:\n                      type: string\n\n  /internal/users/{userId}/profile:\n    parameters:\n      - in: path\n        name: userId\n        required: true\n        schema:\n          type: string\n    put:\n      tags:\n        - \"Module 3 \u25b8 Inter-Service: Data Services\"\n      summary: Sync Settings (User Control Center \u2794 Data Services)\n      description: \"Cascades user settings updates down to the core database.\"\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/UserSettings'\n      responses:\n        '200':\n          description: Core profile updated.\n\n  /internal/users/{userId}/subscriptions/{channelId}/status:\n    parameters:\n      - in: path\n        name: userId\n        required: true\n        schema:\n          type: string\n      - in: path\n        name: channelId\n        required: true\n        schema:\n          type: string\n    get:\n      tags:\n        - \"Module 3 \u25b8 Inter-Service: Data Services\"\n      summary: Get Subscription Alert Status (Notification \u2794 Data Services)\n      description: \"Checks if the user has the bell icon enabled for a specific channel before sending a Type 1 push.\"\n      responses:\n        '200':\n          description: Subscription alert status.\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  alertsEnabled:\n                    type: boolean\n                    example: true\n\n  /internal/videos/{videoId}/trending-score:\n    parameters:\n      - in: path\n        name: videoId\n        required: true\n        schema:\n          type: string\n    put:\n      tags:\n        - \"Module 3 \u25b8 Inter-Service: Data Services\"\n      summary: Update Trending Score (Analytics/Feedback \u2794 Data Services)\n      description: \"Mutates the video's trending score based on explicit feedback, shares, or completed watch sessions.\"\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                scoreDelta:\n                  type: number\n                  example: 2.5\n                source:\n                  type: string\n                  example: \"FeedbackCollector\"\n      responses:\n        '200':\n          description: Trending score updated.\n\n  # =====================================================\n  # MODULE 4 \u25b8 NOTIFICATIONS\n  # =====================================================\n\n  /notifications:\n    get:\n      tags:\n        - \"Module 4 \u25b8 Notifications\"\n      summary: List Notifications (Inbox)\n      description: \"Retrieves the authenticated user's recent notification inbox.\"\n      security:\n        - BearerAuth: []\n      responses:\n        '200':\n          description: Array of notification payloads.\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/NotificationLog'\n        '401':\n          $ref: '#/components/responses/UnauthorizedError'\n\n  /notifications/preferences:\n    get:\n      tags:\n        - \"Module 4 \u25b8 Notifications\"\n      summary: Get Push Preferences\n      security:\n        - BearerAuth: []\n      responses:\n        '200':\n          description: Returns push preference settings.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/NotificationPreferences'\n    put:\n      tags:\n        - \"Module 4 \u25b8 Notifications\"\n      summary: Update Push Preferences\n      security:\n        - BearerAuth: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/NotificationPreferences'\n      responses:\n        '200':\n          description: Notification preferences successfully updated.\n\n  /notifications/{notificationId}/read:\n    parameters:\n      - in: path\n        name: notificationId\n        required: true\n        schema:\n          type: string\n    put:\n      tags:\n        - \"Module 4 \u25b8 Notifications\"\n      summary: Mark Notification as Read\n      security:\n        - BearerAuth: []\n      responses:\n        '204':\n          description: Notification successfully marked as read.\n\n  # =====================================================\n  # MODULE 4 \u25b8 INTER-SERVICE: EVENT TRIGGERS\n  # =====================================================\n\n  /internal/notifications/trigger/new-upload:\n    post:\n      tags:\n        - \"Module 4 \u25b8 Inter-Service: Event Triggers\"\n      summary: Trigger New Upload Notification (Ingestion \u2794 Notification)\n      description: \"Wakes up the Notification Manager to fan out Type 1 push notifications to all bell-enabled subscribers of the channel.\"\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                channelId:\n                  type: string\n                  example: \"c456\"\n                videoId:\n                  type: string\n                  example: \"v123\"\n      responses:\n        '202':\n          description: Event accepted for async processing.\n\n  /internal/notifications/trigger/relevance-detected:\n    post:\n      tags:\n        - \"Module 4 \u25b8 Inter-Service: Event Triggers\"\n      summary: Trigger AI Relevance Push (AI Engine \u2794 Notification)\n      description: \"Tells the Notification Manager a high-confidence video match was found \u2014 initiates a Type 2 recommendation push.\"\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                userId:\n                  type: string\n                  example: \"u001\"\n                videoId:\n                  type: string\n                  example: \"v123\"\n                relevanceScore:\n                  type: number\n                  example: 0.98\n      responses:\n        '202':\n          description: Recommendation push queued.\n\n  /internal/notifications/log:\n    post:\n      tags:\n        - \"Module 4 \u25b8 Inter-Service: Event Triggers\"\n      summary: Log Notification Delivery (Notification \u2794 Data Services)\n      description: \"Records that a notification was dispatched so the user isn't spammed with duplicates.\"\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/NotificationLog'\n      responses:\n        '201':\n          description: Delivery log saved.\n\ncomponents:\n  securitySchemes:\n    BearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT\n      description: OAuth 2.0 Bearer token. Obtain via `POST /auth/google` or `POST /auth/refresh`.\n\n  schemas:\n    GoogleAuthRequest:\n      type: object\n      required:\n        - idToken\n      properties:\n        idToken:\n          type: string\n          example: \"eyJhbGciOiJSUzI1NiIsImtpZCI6...\"\n\n    AuthResponse:\n      type: object\n      properties:\n        userId:\n          type: string\n          example: \"user_abc123\"\n        accessToken:\n          type: string\n          example: \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...\"\n        refreshToken:\n          type: string\n          example: \"ref_token_xyz789_abcdef\"\n        expiresIn:\n          type: integer\n          example: 3600\n\n    UserProfile:\n      type: object\n      properties:\n        userId:\n          type: string\n          example: \"user_abc123\"\n        email:\n          type: string\n          example: \"user@gmail.com\"\n        displayName:\n          type: string\n          example: \"Tech Enthusiast\"\n        avatarUrl:\n          type: string\n          example: \"https://youtube.com/img/avatar.jpg\"\n        createdAt:\n          type: string\n          format: date-time\n          example: \"2020-05-15T14:30:00Z\"\n\n    SessionCreateRequest:\n      type: object\n      properties:\n        deviceType:\n          type: string\n          example: \"iOS\"\n        appVersion:\n          type: string\n          example: \"16.42.3\"\n\n    SessionContext:\n      type: object\n      properties:\n        sessionId:\n          type: string\n          example: \"sess_987654321\"\n        geoContext:\n          type: string\n          example: \"US-NY\"\n\n    PageInfo:\n      type: object\n      properties:\n        totalResults:\n          type: integer\n          example: 1000\n        resultsPerPage:\n          type: integer\n          example: 10\n\n    VideoListResponse:\n      type: object\n      properties:\n        nextPageToken:\n          type: string\n          example: \"CAUQAA\"\n        pageInfo:\n          $ref: '#/components/schemas/PageInfo'\n        items:\n          type: array\n          items:\n            $ref: '#/components/schemas/Video'\n\n    Video:\n      type: object\n      properties:\n        id:\n          type: string\n          example: \"dQw4w9WgXcQ\"\n        snippet:\n          type: object\n          properties:\n            channelId:\n              type: string\n              example: \"UC38IQsAvIsxxjztdMZQtwHA\"\n            title:\n              type: string\n              example: \"Never Gonna Give You Up\"\n            durationSeconds:\n              type: integer\n              description: Total video length in seconds.\n              example: 212\n        statistics:\n          type: object\n          description: Lightweight counters for feed rendering. Full engagement stats via GET /videos/{videoId}/stats.\n          properties:\n            viewCount:\n              type: integer\n              example: 1483929411\n            trendingScore:\n              type: number\n              example: 98.4\n\n    VideoStats:\n      type: object\n      description: Full engagement statistics for a video. Like/dislike counts are authoritative here; Video.statistics carries only viewCount and trendingScore for feed rendering.\n      properties:\n        videoId:\n          type: string\n          example: \"dQw4w9WgXcQ\"\n        likeCount:\n          type: integer\n          example: 16000000\n        dislikeCount:\n          type: integer\n          example: 12000\n        commentCount:\n          type: integer\n          example: 54302\n        shareCount:\n          type: integer\n          example: 8500\n\n    VideoInteractionRequest:\n      type: object\n      required:\n        - action\n      properties:\n        action:\n          type: string\n          enum: ['LIKE', 'DISLIKE', 'CLIP', 'SAVE']\n          example: \"SAVE\"\n        playlistId:\n          type: string\n          description: Required when action is SAVE.\n          example: \"PL1234567890\"\n        clipSettings:\n          type: object\n          description: Required when action is CLIP.\n          properties:\n            startTimeMs:\n              type: integer\n              example: 15000\n            endTimeMs:\n              type: integer\n              example: 45000\n\n    StreamManifestResponse:\n      type: object\n      properties:\n        hlsManifestUrl:\n          type: string\n          example: \"https://manifest.youtube.com/api/hls/playlist.m3u8\"\n        resolutions:\n          type: array\n          items:\n            type: string\n          example: [\"1080p\", \"720p\", \"480p\", \"360p\"]\n\n    ChapterListResponse:\n      type: object\n      properties:\n        chapters:\n          type: array\n          items:\n            type: object\n            properties:\n              title:\n                type: string\n                example: \"Introduction\"\n              startTimestamp:\n                type: integer\n                example: 0\n\n    Comment:\n      type: object\n      properties:\n        commentId:\n          type: string\n          example: \"cmnt_123abc\"\n        authorDisplayName:\n          type: string\n          example: \"Tech Enthusiast\"\n        text:\n          type: string\n          example: \"This video was incredibly helpful, thanks for sharing!\"\n        publishedAt:\n          type: string\n          format: date-time\n          example: \"2023-10-24T23:22:28Z\"\n        likeCount:\n          type: integer\n          example: 42\n\n    CommentListResponse:\n      type: object\n      properties:\n        nextPageToken:\n          type: string\n          example: \"CAIQAA\"\n        items:\n          type: array\n          items:\n            $ref: '#/components/schemas/Comment'\n\n    Playlist:\n      type: object\n      properties:\n        id:\n          type: string\n          example: \"PL1234567890\"\n        snippet:\n          type: object\n          properties:\n            title:\n              type: string\n              example: \"My Favorite Music\"\n            description:\n              type: string\n              example: \"A collection of the best tracks.\"\n        status:\n          type: object\n          properties:\n            privacyStatus:\n              type: string\n              enum: ['public', 'unlisted', 'private']\n              example: \"public\"\n\n    PlaylistListResponse:\n      type: object\n      properties:\n        nextPageToken:\n          type: string\n          example: \"CAIQAA\"\n        pageInfo:\n          $ref: '#/components/schemas/PageInfo'\n        items:\n          type: array\n          items:\n            $ref: '#/components/schemas/Playlist'\n\n    PlaylistItem:\n      type: object\n      properties:\n        id:\n          type: string\n          example: \"pli_abc123\"\n        snippet:\n          type: object\n          properties:\n            playlistId:\n              type: string\n              example: \"PL1234567890\"\n            position:\n              type: integer\n              example: 0\n            resourceId:\n              type: object\n              properties:\n                videoId:\n                  type: string\n                  example: \"dQw4w9WgXcQ\"\n\n    PlaylistItemListResponse:\n      type: object\n      properties:\n        nextPageToken:\n          type: string\n          example: \"CAIQAA\"\n        pageInfo:\n          $ref: '#/components/schemas/PageInfo'\n        items:\n          type: array\n          items:\n            $ref: '#/components/schemas/PlaylistItem'\n\n    SubscriptionListResponse:\n      type: object\n      properties:\n        nextPageToken:\n          type: string\n          example: \"CAIQAA\"\n        items:\n          type: array\n          items:\n            type: object\n            properties:\n              id:\n                type: string\n                example: \"su_1234567890\"\n\n    PlaybackEventBatch:\n      type: object\n      properties:\n        videoId:\n          type: string\n          example: \"dQw4w9WgXcQ\"\n        sessionId:\n          type: string\n          example: \"sess_987654321\"\n        events:\n          type: array\n          items:\n            type: object\n            properties:\n              eventType:\n                type: string\n                enum: ['PLAY', 'PAUSE', 'SEEK', 'BUFFER']\n                example: \"PLAY\"\n              timestamp:\n                type: number\n                example: 1699564800000\n\n    WatchSummary:\n      type: object\n      properties:\n        sessionId:\n          type: string\n          example: \"sess_987654321\"\n        watchMinutes:\n          type: number\n          example: 3.5\n        skipRatio:\n          type: number\n          example: 0.15\n\n    UserSettings:\n      type: object\n      properties:\n        privacy:\n          type: object\n          properties:\n            dataTrackingEnabled:\n              type: boolean\n              example: true\n        prefVector:\n          type: object\n          properties:\n            interests:\n              type: array\n              items:\n                type: string\n              example: [\"music\", \"gaming\"]\n\n    NotificationLog:\n      type: object\n      properties:\n        notificationId:\n          type: string\n          example: \"notif_789\"\n        notificationType:\n          type: string\n          enum: ['NEW_UPLOAD', 'RECOMMENDED', 'BROADCAST']\n          example: \"NEW_UPLOAD\"\n        status:\n          type: string\n          enum: ['DELIVERED', 'READ']\n          example: \"DELIVERED\"\n\n    NotificationPreferences:\n      type: object\n      properties:\n        pushEnabled:\n          type: boolean\n          example: true\n\n    ErrorProto:\n      type: object\n      properties:\n        error:\n          type: object\n          properties:\n            code:\n              type: integer\n              example: 400\n            message:\n              type: string\n              example: \"Invalid Request\"\n\n  responses:\n    BadRequestError:\n      description: Bad Request \u2014 invalid parameters or payload.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/ErrorProto'\n    UnauthorizedError:\n      description: Unauthorized \u2014 missing or invalid Bearer token.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/ErrorProto'\n    NotFoundError:\n      description: Not Found \u2014 resource does not exist.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/ErrorProto'\n    RateLimitError:\n      description: Too Many Requests \u2014 rate limit exceeded.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/ErrorProto'\n";
    const spec = jsyaml.load(yamlSpec);
    SwaggerUIBundle({
      spec: spec,
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIBundle.SwaggerUIStandalonePreset
      ],
      layout: "BaseLayout"
    });
  </script>
