# YouTube Clone Backend - CI/CD Pipeline
# Deploys FastAPI backend to Render or Railway

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "Youtube/youtube-clone/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "Youtube/youtube-clone/backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch: # Manual trigger

env:
  PYTHON_VERSION: "3.11"
  WORKING_DIR: Youtube/youtube-clone/backend

jobs:
  # ===========================================================================
  # Job 1: Lint and Test
  # ===========================================================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.WORKING_DIR }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with Ruff
        run: |
          ruff check app/ --output-format=github || true
        continue-on-error: true # Don't fail on lint warnings initially

      - name: Run tests
        run: |
          # Run pytest if tests exist, otherwise skip
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests found - skipping pytest"
          fi
        env:
          # Use dummy values for CI (tests should mock external services)
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_KEY: dummy-service-key
          SUPABASE_JWT_SECRET: dummy-jwt-secret
          FRONTEND_URL: http://localhost:3000

      - name: Verify app imports
        run: |
          python -c "from app.main import app; print('App imports OK')"
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_KEY: dummy-service-key
          SUPABASE_JWT_SECRET: dummy-jwt-secret
          FRONTEND_URL: http://localhost:3000

  # ===========================================================================
  # Job 2: Build Docker Image
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          push: false
          tags: youtube-clone-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker build -t youtube-clone-backend:test .
          docker run --rm -d --name test-container \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_ANON_KEY=dummy \
            -e SUPABASE_SERVICE_KEY=dummy \
            -e SUPABASE_JWT_SECRET=dummy \
            -e FRONTEND_URL=http://localhost:3000 \
            -p 8000:8000 \
            youtube-clone-backend:test

          # Wait for startup (FAISS + model loading takes ~30-60s)
          echo "Waiting for container to start..."
          sleep 45

          # Health check
          curl -f http://localhost:8000/health || (docker logs test-container && exit 1)

          # Cleanup
          docker stop test-container

  # ===========================================================================
  # Job 3: Deploy to Render
  # ===========================================================================
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Render deployment triggered"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set - skipping Render deploy"
          fi

  # ===========================================================================
  # Job 3 (Alternative): Deploy to Railway
  # ===========================================================================
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'railway'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          cd ${{ env.WORKING_DIR }}
          railway up --service youtube-clone-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ===========================================================================
  # Job 3 (Alternative): Deploy to Modal
  # ===========================================================================
  deploy-modal:
    name: Deploy to Modal
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'modal'
    environment: production
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Modal CLI
        run: pip install modal

      - name: Deploy to Modal
        run: modal deploy modal_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Verify deployment
        run: |
          echo "### 🚀 Modal Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "App deployed to Modal. Check https://modal.com/apps for status." >> $GITHUB_STEP_SUMMARY

# ===========================================================================
# Required Secrets (set in GitHub repo settings):
# ===========================================================================
# For Render:
#   - RENDER_DEPLOY_HOOK_URL: Deploy hook URL from Render dashboard
#
# For Railway:
#   - RAILWAY_TOKEN: Railway API token
#
# For Modal:
#   - MODAL_TOKEN_ID: Modal token ID (from `modal token new`)
#   - MODAL_TOKEN_SECRET: Modal token secret (from `modal token new`)
#
# Repository Variables:
#   - DEPLOY_TARGET: Set to 'railway', 'modal', or leave empty for Render
# ===========================================================================
